<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Apache Camel Log Dashboard</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 30px;
        }

        .header {
            background: white;
            padding: 20px;
            border-left: 6px solid #1976d2;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            color: #1976d2;
            margin: 0;
        }

        .filters {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-width: 180px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th {
            background: #1976d2;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            vertical-align: top;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .badge-error {
            background: #ffebee;
            color: #c62828;
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: bold;
        }

        .badge-info {
            background: #e3f2fd;
            color: #1565c0;
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: bold;
        }

        .badge-warn {
            background: #fff3e0;
            color: #ef6c00;
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: bold;
        }

        .json-box {
            font-family: monospace;
            background: #f8f8f8;
            padding: 8px;
            border-radius: 5px;
            max-width: 450px;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: gray;
            font-size: 18px;
        }

    </style>
</head>

<body>

<div class="header">
    <h2>Apache Camel Monitoring Dashboard</h2>
    <p>
        INFO, WARN and ERROR logs captured from Apache Camel Routes.
    </p>
</div>

<div class="filters">

    <input type="text"
           id="searchInput"
           placeholder="Search anything..."
           onkeyup="filterTable()">

    <input type="date"
           id="dateFilter"
           onchange="filterTable()">

    <input type="text"
           id="orderFilter"
           placeholder="Search Order No"
           onkeyup="filterTable()">

    <select id="logLevelFilter"
            onchange="filterTable()">

        <option value="">All Log Levels</option>
        <option value="INFO">INFO</option>
        <option value="WARN">WARN</option>
        <option value="ERROR">ERROR</option>

    </select>

</div>

<table id="logTable">

    <thead>

    <tr>
        <th>#</th>
        <th>Date & Time</th>
        <th>Order No</th>
        <th>Log Level</th>
        <th>Message</th>
        <th>Payload</th>
    </tr>

    </thead>

    <tbody>

    <tr th:if="${#lists.isEmpty(records)}">

        <td colspan="6" class="no-data">
            No logs available
        </td>

    </tr>

    <tr th:each="record, stat : ${records}">

        <td th:text="${stat.count}"></td>

        <td th:text="${record.dateTime}"></td>

        <td th:text="${record.orderNo}"></td>

        <td>

            <span th:if="${record.logLevel == 'ERROR'}"
                  class="badge-error"
                  th:text="${record.logLevel}">
            </span>

            <span th:if="${record.logLevel == 'INFO'}"
                  class="badge-info"
                  th:text="${record.logLevel}">
            </span>

            <span th:if="${record.logLevel == 'WARN'}"
                  class="badge-warn"
                  th:text="${record.logLevel}">
            </span>

        </td>

        <td th:text="${record.message}"></td>

        <td>
            <div class="json-box"
                 th:text="${record.payload}">
            </div>
        </td>

    </tr>

    </tbody>

</table>

<script>

    function filterTable() {

        let searchValue =
            document.getElementById("searchInput")
                .value
                .toLowerCase();

        let dateValue =
            document.getElementById("dateFilter")
                .value;

        let orderValue =
            document.getElementById("orderFilter")
                .value
                .toLowerCase();

        let logLevelValue =
            document.getElementById("logLevelFilter")
                .value
                .toLowerCase();

        let table =
            document.getElementById("logTable");

        let rows =
            table.getElementsByTagName("tr");

        for (let i = 1; i < rows.length; i++) {

            let rowText =
                rows[i].innerText.toLowerCase();

            let dateText =
                rows[i].cells[1]?.innerText || "";

            let orderText =
                rows[i].cells[2]?.innerText.toLowerCase() || "";

            let logLevelText =
                rows[i].cells[3]?.innerText.toLowerCase() || "";

            let matchesSearch =
                rowText.includes(searchValue);

            let matchesDate =
                dateValue === "" ||
                dateText.startsWith(dateValue);

            let matchesOrder =
                orderValue === "" ||
                orderText.includes(orderValue);

            let matchesLogLevel =
                logLevelValue === "" ||
                logLevelText.includes(logLevelValue);

            if (
                matchesSearch &&
                matchesDate &&
                matchesOrder &&
                matchesLogLevel
            ) {
                rows[i].style.display = "";
            } else {
                rows[i].style.display = "none";
            }
        }
    }

</script>

</body>
</html>
